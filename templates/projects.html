<div class="projects-grid">
    {% for project in projects %}
    <div class="project-card" data-aos="fade-up">
        <h3>{{ project.title }}</h3>
        <p>{{ project.desc }}</p>
        <div class="tags">
            {% for tech in project.tech %}
            <span>#{{ tech }}</span>
            {% endfor %}
        </div>
        <a href="javascript:void(0)" class="project-link" onclick="openProject('{{ project.id }}')">View Project &rarr;</a>
    </div>
    {% endfor %}
</div>

<div id="project-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content project-detail-card" style="max-width: 600px; text-align: left;">
        <span class="close-modal" onclick="closeProject()">&times;</span>
        <h2 id="modal-title" class="modal-title" style="color: var(--primary);"></h2>
        <div id="modal-tags" class="tags" style="margin: 20px 0;"></div>
        <p id="modal-desc" class="modal-subtitle" style="line-height: 1.6; color: #f8fafc;"></p>
        
        <div class="modal-footer" style="margin-top: 40px; display: flex; justify-content: flex-start;">
            <a id="modal-link" href="#" target="_blank" class="btn-main" style="margin-top: 0; padding: 12px 30px; font-size: 0.9rem;">
                Explore Source Code
            </a>
        </div>
    </div>
</div>

<script>
    // Injects the Python list into a JS variable
    const allProjects = {{ projects | tojson }};

    function openProject(projectId) {
        const selected = allProjects.find(p => p.id === projectId);
        if (selected) {
            document.getElementById('modal-title').innerText = selected.title;
            document.getElementById('modal-desc').innerText = selected.desc;
            document.getElementById('modal-link').href = selected.link;
            
            // Generate tags dynamically
            const tagBox = document.getElementById('modal-tags');
            tagBox.innerHTML = selected.tech.map(t => `<span style="background: rgba(56, 189, 248, 0.1); padding: 5px 12px; border-radius: 8px; margin-right: 8px; font-size: 0.8rem;">#${t}</span>`).join('');
            
            // Show modal with flex
            const modal = document.getElementById('project-modal');
            modal.style.display = 'flex';
        }
    }

    function closeProject() {
        document.getElementById('project-modal').style.display = 'none';
    }

    // Close modal if user clicks outside the card
    window.onclick = function(event) {
        const modal = document.getElementById('project-modal');
        if (event.target == modal) {
            closeProject();
        }
    }
</script>
